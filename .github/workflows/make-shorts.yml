name: Make Shorts

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: "YouTube video URL"
        required: true
        type: string
      clips_count:
        description: "Number of shorts"
        required: false
        default: "3"
        type: string

  repository_dispatch:
    types: [make_shorts]

jobs:
  build-shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set inputs
        id: vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "youtube_url=${{ github.event.client_payload.youtube_url }}" >> "$GITHUB_OUTPUT"
            echo "clips_count=${{ github.event.client_payload.clips_count || '3' }}" >> "$GITHUB_OUTPUT"
          else
            echo "youtube_url=${{ inputs.youtube_url }}" >> "$GITHUB_OUTPUT"
            echo "clips_count=${{ inputs.clips_count }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install yt-dlp, Whisper and YouTube JS support
        run: |
           python3 -m pip install --upgrade pip
           python3 -m pip install -U "yt-dlp[default]"
           python3 -m pip install faster-whisper

           curl -fsSL https://deno.land/install.sh | sh
           echo "$HOME/.deno/bin" >> "$GITHUB_PATH"

      - name: Restore YouTube cookies
        env:
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
        run: |
          if [ -z "$YOUTUBE_COOKIES_B64" ]; then
            echo "Missing YOUTUBE_COOKIES_B64 secret"
            exit 1
          fi

          echo "$YOUTUBE_COOKIES_B64" | base64 --decode > cookies.txt

          if [ ! -s cookies.txt ]; then
            echo "cookies.txt is empty"
            exit 1
          fi

          echo "cookies.txt restored successfully"

      - name: Check tools
        run: |
          python3 --version
          ffmpeg -version | head -n 1
          yt-dlp --version
          "$HOME/.deno/bin/deno" --version

      - name: Create shorts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_URL: ${{ steps.vars.outputs.youtube_url }}
          CLIPS_COUNT: ${{ steps.vars.outputs.clips_count }}
          YOUTUBE_COOKIES_FILE: ${{ github.workspace }}/cookies.txt
          GEMINI_MODEL: gemini-3.5-flash-lite
       run: |
          python3 scripts/make_shorts.py
      - name: Delete cookies
        if: always()
        run: |
          rm -f cookies.txt

      - name: Upload rendered shorts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-shorts
          path: output/
          if-no-files-found: warn
          retention-days: 7
